[package]
name = "open-mess-test-echo"
description = "Test guest for the open_mess module host: echoes, fetches, opens sockets, stores, sets timers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
# The wasm32-wasip2 component the host's tests load; empty on other targets.
crate-type = ["cdylib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
serde_json = "1.0.154"
wit-bindgen = "0.63"

[lints]
workspace = true
