[package]
name = "open-mess-teams"
description = "The Microsoft Teams platform module of open_mess (WebAssembly component)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# cdylib: the wasm32-wasip2 component the core loads; rlib: native tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1.0.154"
url = "2.5.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = "0.63"

[lints]
workspace = true
