[workspace]
resolver = "3"
members = ["crates/*", "modules/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# 1.88: the wit-bindgen toolchain the wasm modules build with (wit-parser, wasm-encoder) needs it.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false

# Never crash: non-test code returns errors instead of panicking (AGENTS.md, "Never crash").
# clippy.toml allows unwrap, expect, panic and indexing inside tests.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
