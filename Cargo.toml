[workspace]
resolver = "3"
members = ["crates/*", "modules/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# 1.89: std::fs::File::try_lock (the daemon's instance lock); 1.88 is also needed by the
# wit-bindgen toolchain the wasm modules build with.
rust-version = "1.89"
license = "MIT OR Apache-2.0"
publish = false

# Never crash: non-test code returns errors instead of panicking (AGENTS.md, "Never crash").
# clippy.toml allows unwrap, expect, panic and indexing inside tests.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
# println!/eprintln! panic when stdout/stderr is closed; write with writeln! and ignore the error.
print_stdout = "deny"
print_stderr = "deny"

# Debug builds and tests compile every module with Cranelift, and unoptimized that took 15-30 s
# per test daemon. The tests starting beside it starved, and their timed module calls ran out
# (flaky Windows CI). Optimizing the compiler's own crates makes a daemon start about ten times
# faster.
[profile.dev.package.cranelift-codegen]
opt-level = 3

[profile.dev.package.cranelift-frontend]
opt-level = 3

[profile.dev.package.regalloc2]
opt-level = 3

[profile.dev.package.wasmparser]
opt-level = 3

[profile.dev.package.wasmtime-environ]
opt-level = 3

[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3

# No profile sets `panic = "abort"`: the daemon catches a panic of the transcription and capture
# threads when it joins them, while abort would end it with every account at once
# (spec 2026-10-28-local-transcription, 4.3).
