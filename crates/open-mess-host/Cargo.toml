[package]
name = "open-mess-host"
description = "The open_mess module host: runs platform modules (WebAssembly components) under limits"
version.workspace = true
edition.workspace = true
# wasmtime 50 needs 1.97; the rest of the workspace keeps its own minimum.
rust-version = "1.97"
license.workspace = true
publish.workspace = true

[features]
# Test-only knobs (short limits, an address policy that allows loopback). The daemon never enables it.
test-support = []

[dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
# The system proxy settings reqwest uses, read for WebSockets too.
hyper-util = { version = "0.1.21", default-features = false, features = ["client-proxy", "client-proxy-system"] }
# Module secrets: keyring picks the platform store (Windows Credential Manager), keyring-core is
# its store interface, so tests can use the mock store.
keyring = "4.2.0"
keyring-core = "1.0.1"
psl = "2.1.245"
# rustls with the platform verifier (Windows certificate store, for TLS-inspecting company
# proxies) and the system proxy settings; ring is the crypto provider (no cmake/NASM build).
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
# The same platform verifier reqwest uses, for WebSocket TLS.
rustls-platform-verifier = "0.7.1"
rusqlite = { version = "0.41.0", features = ["bundled"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
tracing = "0.1.44"
url = "2.5.8"
wasmtime = { version = "50.0.0", default-features = false, features = ["async", "component-model", "cranelift", "parallel-compilation", "runtime"] }
wasmtime-wasi = { version = "50.0.0", default-features = false, features = ["p2"] }

[dev-dependencies]
axum = "0.8.9"
open-mess-host = { path = ".", features = ["test-support"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }

[lints]
workspace = true
