<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>open_mess - ustawienia</title>
  <link rel="stylesheet" href="app.css">
  <script src="app.js" defer></script>
</head>
<body>
  <nav id="menu" aria-label="Sekcje">
    <div class="brand">open_mess</div>
    <button type="button" data-section="accounts">Konta</button>
    <button type="button" data-section="permissions">Uprawnienia agentów</button>
    <button type="button" data-section="waiting">Do zatwierdzenia <span id="waiting-count" class="badge" hidden></span></button>
    <button type="button" data-section="modules">Moduły</button>
    <button type="button" data-section="integrations">Integracje</button>
    <button type="button" data-section="daemon">Demon i logi</button>
    <footer id="daemon-state" class="muted">Demon działa</footer>
  </nav>
  <main>
    <p id="error" class="error" role="alert" hidden></p>
    <section id="accounts">
      <h1>Konta</h1>
      <div class="content"></div>
    </section>
    <section id="permissions" hidden>
      <h1>Uprawnienia agentów</h1>
      <div class="content"></div>
    </section>
    <section id="waiting" hidden>
      <h1>Do zatwierdzenia</h1>
      <div class="content"></div>
    </section>
    <section id="modules" hidden>
      <h1>Moduły</h1>
      <div class="content"></div>
    </section>
    <section id="integrations" hidden>
      <h1>Integracje (MCP / CLI)</h1>
      <div class="content"></div>
    </section>
    <section id="daemon" hidden>
      <h1>Demon i logi</h1>
      <div class="content"></div>
    </section>
  </main>
</body>
</html>
