[package]
name = "open-mess"
description = "The open_mess daemon and CLI"
version.workspace = true
edition.workspace = true
# The module host (wasmtime 50) needs 1.97.
rust-version = "1.97"
license.workspace = true
publish.workspace = true

[lib]
name = "open_mess"
path = "src/lib.rs"

[[bin]]
name = "om"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.4.3"
# keyring 4's own facade always installs the platform store on first use, so tests can't swap in
# the mock store. keyring-core plus the Windows store crate is the keyring 4 ecosystem's way for an
# application to choose its store.
keyring-core = "1.0.1"
open-mess-host = { path = "../open-mess-host" }
# Talks only to http://127.0.0.1: no TLS, no system proxy.
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
rmcp = { version = "3.7.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
# Cargo unifies reqwest features across the workspace, and the module host builds it with
# rustls-no-provider; every reqwest client then needs a process-wide crypto provider.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Module files and manifests are approved by their SHA-256.
sha2 = "0.10.9"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1.1.0"

[dev-dependencies]
rmcp = { version = "3.7.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["sync", "test-util"] }

[lints]
workspace = true
