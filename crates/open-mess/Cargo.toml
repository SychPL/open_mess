[package]
name = "open-mess"
description = "The open_mess daemon and CLI"
version.workspace = true
edition.workspace = true
# The module host (wasmtime 50) needs 1.97.
rust-version = "1.97"
license.workspace = true
publish.workspace = true

[lib]
name = "open_mess"
path = "src/lib.rs"

[[bin]]
name = "om"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
# RFC 3339 times in the `pending` tool; rmcp builds it already.
chrono = { version = "0.4.45", default-features = false, features = ["alloc"] }
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.4.3"
# keyring 4's own facade always installs the platform store on first use, so tests can't swap in
# the mock store. keyring-core plus the Windows store crate is the keyring 4 ecosystem's way for an
# application to choose its store.
keyring-core = "1.0.1"
open-mess-host = { path = "../open-mess-host" }
# Talks only to http://127.0.0.1: no TLS, no system proxy.
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
rmcp = { version = "3.7.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
# Cargo unifies reqwest features across the workspace, and the module host builds it with
# rustls-no-provider; every reqwest client then needs a process-wide crypto provider.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Module files and manifests are approved by their SHA-256.
sha2 = "0.10.9"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
# The `Show all` dialog of an approval.
rfd = { version = "0.17.2", default-features = false }
# The tray icon and the configuration window (spec 8.8). No default features: no comctl32 v6
# imports (test binaries have no manifest for them), no dynamic ACL, no compression.
# custom-protocol: the window's page is always the embedded `ui/` folder, never a dev server.
tauri = { version = "2.11.6", default-features = false, features = ["wry", "tray-icon", "custom-protocol"] }
# Approval toasts with buttons, activated in this process.
tauri-winrt-notification = "0.8.1"
# Takes a toast off the screen once its action is decided elsewhere; the version
# tauri-winrt-notification already builds.
windows = { version = "0.62.2", features = ["UI_Notifications"] }
windows-native-keyring-store = "1.1.0"
# Registers the toasts' AppUserModelID for the current user.
winreg = "0.56.0"

[target.'cfg(windows)'.build-dependencies]
tauri-build = "2.6.3"

[target.'cfg(windows)'.dev-dependencies]
# The mock runtime, for the window logic without a webview.
tauri = { version = "2.11.6", default-features = false, features = ["test"] }

[dev-dependencies]
# Short call limits, so the tests of slow and crashing modules finish quickly.
open-mess-host = { path = "../open-mess-host", features = ["test-support"] }
rmcp = { version = "3.7.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["sync", "test-util"] }

[lints]
workspace = true
