# Releases open_mess from main: `cargo xtask release <version> --pipeline` with the signing key from
# the "release" environment, which only main may use and the owner approves for every run
# (spec 2026-10-28-release-pipeline). This job sees the key, so every action is pinned to a commit.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, like 1.2.3"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    name: Release
    runs-on: windows-latest
    environment: release
    # Explicit, so cancelling the run always cancels the job.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    concurrency:
      group: release
      cancel-in-progress: false
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      # xtask checks the branch name and pushes main, whether or not checkout left HEAD detached.
      - run: git checkout -B main "$env:GITHUB_SHA"
      # No rust-cache: a release takes nothing from a cache other runs could have written.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10-16
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-wasip2
      - name: Git identity for the Release commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898094+github-actions[bot]@users.noreply.github.com"
      # Byte for byte (UTF-8 without BOM, no added newline): minisign refuses a reshaped key file.
      - name: Write the release key
        env:
          RELEASE_KEY_FILE: ${{ secrets.RELEASE_KEY_FILE }}
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'release.key'
          [IO.File]::WriteAllText($path, $env:RELEASE_KEY_FILE, [Text.UTF8Encoding]::new($false))
          "OPEN_MESS_RELEASE_KEY=$path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      # The version reaches the script only through the environment, never as script text.
      - name: Release
        timeout-minutes: 75
        env:
          VERSION: ${{ inputs.version }}
          OPEN_MESS_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask release "$env:VERSION" --pipeline
      # The built files outlive the runner, for the recovery commands xtask prints.
      - if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist-${{ inputs.version }}
          path: target/release-dist
          retention-days: 14
          if-no-files-found: ignore
      # Also after a timeout or a cancel, which stop xtask before it prints anything: when this run's tag
      # reached origin (or that is unknown), the run summary says how to finish the release from the artifact.
      - name: How to finish the release
        if: failure() || cancelled()
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = "v$env:VERSION"
          # This run's tag sits on HEAD, the Release commit; without it nothing was pushed.
          $local = git rev-parse --verify --quiet "refs/tags/$tag"
          if (-not $local -or (git rev-parse "$tag^{commit}") -ne (git rev-parse HEAD)) { exit 0 }
          $remote = git ls-remote origin "refs/tags/$tag"
          if ($LASTEXITCODE -eq 0 -and -not "$remote".StartsWith($local)) { exit 0 }
          $files = @(Get-ChildItem -LiteralPath target/release-dist -File -Name -ErrorAction SilentlyContinue | ForEach-Object { " target/release-dist/$_" }) -join ''
          $lines = @(
            '### Finish release {0}' -f $tag
            ''
            'This run pushed the Release commit and {0} (or could not tell); the release is missing or still a draft. In a clone of the repository at {0}:' -f $tag
            ''
            '    # check that the tag reached origin:'
            '    git ls-remote origin refs/tags/{0}' -f $tag
            '    # it lists nothing: nothing reached origin; run the workflow again instead.'
            '    # get the files of the release:'
            '    gh run download {0} -n release-dist-{1} -D target/release-dist' -f $env:GITHUB_RUN_ID, $env:VERSION
            '    # see what GitHub holds:'
            '    gh release view {0} --json isDraft,assets' -f $tag
            '    # published, with every file of target/release-dist at its size: nothing to do.'
            '    # a draft: upload the files again, check them with gh release view as above, then publish:'
            '    gh release upload {0}{1} --clobber' -f $tag, $files
            '    gh release edit {0} --draft=false' -f $tag
            '    # no release: create the draft, check it the same way, then publish:'
            '    gh release create {0} --verify-tag --draft --title {0} --notes ""{1}' -f $tag, $files
            '    gh release edit {0} --draft=false' -f $tag
            ''
          )
          $lines -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          exit 0
      - name: Remove the release key
        if: always()
        run: Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'release.key') -Force -ErrorAction SilentlyContinue
